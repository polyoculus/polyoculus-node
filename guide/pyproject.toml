[project]
name = "guide"
version = "0.1.0"
description = "Autoguiding for a PolyOculus node: DMK guide camera + INDI mount"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pyindi-client>=2.2.0",
    "loguru>=0.7",
    "pyserial",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "../mount/src", "../camera"]
