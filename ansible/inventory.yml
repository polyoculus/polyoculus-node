# One entry per Nano. Nanos answer to <name>.local on the lab network (mDNS), so no IPs are
# needed; give a host `ansible_host: <ip>` only if mDNS doesn't reach it.
nanos:
  hosts:
    nano-01:
    nano-02:
    nano-03:
    nano-04:
    nano-05:
    nano-06:
    nano-07:
    nano-08:
  vars:
    ansible_user: alarm
    ansible_host: "{{ inventory_hostname }}.local"
