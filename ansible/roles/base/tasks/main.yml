---
- name: Base packages
  community.general.pacman:
    name: "{{ base_packages }}"
    state: present
    update_cache: true

# We boot /boot/Image-nano; Arch's stock kernel would only rebuild an unused initramfs on updates
- name: Stock kernel removed
  community.general.pacman:
    name: linux-aarch64
    state: absent

# The Nano names itself at every boot from nodes.txt (camera serial, then board MAC, then the
# name it was flashed with), so Ansible never sets the hostname
- name: Identity script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../os/identity.sh"
    dest: /usr/local/bin/polyoculus-identity
    mode: "0755"

- name: Identity service
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../os/polyoculus-identity.service"
    dest: /etc/systemd/system/polyoculus-identity.service
    mode: "0644"
  register: base_identity_unit

- name: Identity service enabled
  ansible.builtin.systemd_service:
    name: polyoculus-identity
    enabled: true
    daemon_reload: "{{ base_identity_unit.changed }}"

- name: Timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Locale generated
  community.general.locale_gen:
    name: en_US.UTF-8

- name: Default locale
  ansible.builtin.copy:
    content: "LANG=en_US.UTF-8\n"
    dest: /etc/locale.conf
    mode: "0644"

# No RTC battery: the clock is wrong until NTP syncs, and the telescopes need it right.
# chrony steps the clock on boot and keeps all Nanos tight; timesyncd would conflict with it.
- name: Timesyncd off
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: stopped
    enabled: false

- name: Chrony config
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    mode: "0644"
  notify: Restart chronyd

- name: Chronyd running
  ansible.builtin.systemd_service:
    name: chronyd
    state: started
    enabled: true

- name: Zram swap (half of RAM, compressed, no SD writes)
  ansible.builtin.copy:
    content: "[zram0]\nzram-size = ram / 2\n"
    dest: /etc/systemd/zram-generator.conf
    mode: "0644"

# No passwords anywhere: nodes outlive the people who set them up, so there is nothing to
# remember or hand over. Console login needs none; remote access is Tailscale SSH or the keys
# below (sshd refuses empty passwords); root is locked and sudo asks for nothing.
- name: Alarm user in wheel (sudo), uucp (mount and mirror serial ports) and video (guide camera)
  ansible.builtin.user:
    name: alarm
    groups: [wheel, uucp, video]
    append: true
    password: ""

- name: Root locked (use sudo)
  ansible.builtin.user:
    name: root
    password_lock: true

- name: Sudo for wheel, no password
  ansible.builtin.copy:
    content: "%wheel ALL=(ALL:ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/wheel
    mode: "0440"
    validate: visudo -cf %s

# Exactly the keys in files/authorized_keys/: deleting someone's .pub revokes their access.
# Never with an empty set, which would lock everyone out but the console.
- name: SSH keys for the alarm user (exactly files/authorized_keys/*.pub)
  ansible.posix.authorized_key:
    user: alarm
    key: "{{ query('ansible.builtin.file', *base_ssh_keys) | join('\n') }}"
    exclusive: true
  vars:
    base_ssh_keys: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/files/authorized_keys/*.pub') }}"
  when: base_ssh_keys | length > 0

- name: Sshd password login setting
  ansible.builtin.copy:
    content: "PasswordAuthentication {{ 'yes' if ssh_password_auth else 'no' }}\nPermitRootLogin no\n"
    dest: /etc/ssh/sshd_config.d/10-nano.conf
    mode: "0644"
    validate: sshd -t -f %s
  notify: Reload sshd

# mDNS: every Nano answers to <hostname>.local on the lab network, so Ansible, chrony and people
# find them by name with no IP bookkeeping (Arch ARM's networkd + resolved do the work)
- name: Resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Resolved answers and resolves .local
  ansible.builtin.copy:
    content: "[Resolve]\nMulticastDNS=yes\n"
    dest: /etc/systemd/resolved.conf.d/10-mdns.conf
    mode: "0644"
  notify: Restart resolved

- name: Network drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/network/{{ item }}.network.d"
    state: directory
    mode: "0755"
  loop: [en, eth]

- name: MDNS on the wired interfaces
  ansible.builtin.copy:
    content: "[Network]\nMulticastDNS=yes\n"
    dest: "/etc/systemd/network/{{ item }}.network.d/10-mdns.conf"
    mode: "0644"
  loop: [en, eth]
  notify: Reload networkd
