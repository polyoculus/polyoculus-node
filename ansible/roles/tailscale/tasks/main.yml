---
# Off for now (group decision, tailscale_enabled in group_vars). Turning it off also removes it
# from Nanos that already had it: deleting config never undoes anything on its own.
- name: Tailscale on
  ansible.builtin.include_tasks: enabled.yml
  when: tailscale_enabled

- name: Tailscaled stopped
  ansible.builtin.systemd_service:
    name: tailscaled
    state: stopped
    enabled: false
  failed_when: false
  when: not tailscale_enabled

- name: Tailscale removed
  community.general.pacman:
    name: tailscale
    state: absent
  when: not tailscale_enabled
