---
- name: Tailscale installed
  community.general.pacman:
    name: tailscale
    state: present

- name: Tailscaled running
  ansible.builtin.systemd_service:
    name: tailscaled
    state: started
    enabled: true

- name: Tailscale login state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

# Auth key from the Tailscale admin console (reusable, pre-approved, tag:nano; see README
# "Access"): TS_AUTHKEY=tskey-... ansible-playbook site.yml
# --ssh: tailnet members the policy allows log in with no password or key (nodes have neither).
- name: Join the tailnet
  ansible.builtin.command: >-
    tailscale up --authkey={{ lookup('ansible.builtin.env', 'TS_AUTHKEY') }}
    --hostname={{ inventory_hostname }} --advertise-tags=tag:nano --ssh
  when:
    - (tailscale_status.stdout | from_json).BackendState | default('') != 'Running'
    - lookup('ansible.builtin.env', 'TS_AUTHKEY') | length > 0
  changed_when: true
  no_log: true

- name: Tailscale preferences
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs
  changed_when: false
  failed_when: false

- name: Tailscale SSH on (Nanos that joined before it was the default)
  ansible.builtin.command: tailscale set --ssh
  when:
    - tailscale_prefs.rc == 0
    - (tailscale_prefs.stdout | from_json).LoggedOut is false
    - not (tailscale_prefs.stdout | from_json).RunSSH | default(false)
  changed_when: true
