---
# SD cards die from writes. Cut the routine ones: logs, access times.
- name: Journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Journald storage
  ansible.builtin.copy:
    content: "[Journal]\nStorage={{ journal_storage }}\nRuntimeMaxUse=64M\nSystemMaxUse=64M\n"
    dest: /etc/systemd/journald.conf.d/10-sd-card.conf
    mode: "0644"
  notify: Restart journald

# Reading a file normally writes its access time back to the card. noatime belongs in fstab
# (systemd remounts / with it early in boot): as rootflags=noatime on the kernel command line,
# ext4 rejects it and the kernel panics before mounting root.
- name: No rootflags=noatime on the kernel command line (it stops the Nano booting)
  ansible.builtin.replace:
    path: /boot/extlinux/extlinux.conf
    regexp: ' rootflags=noatime'
    replace: ''

- name: Root mounted noatime (takes effect next boot)
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\S+\s+/\s'
    line: "{{ ansible_facts.cmdline.root }} / ext4 rw,noatime 0 0"
